---
layout: portfolio_base
---
<section class="page-hero">
  <div class="wrap narrow">
    {% if page.kicker %}<div class="eyebrow">{{ page.kicker }}</div>{% endif %}
    <h1>{{ page.display_title | default: page.title }}</h1>
    {% if page.description %}<p class="page-deck">{{ page.description }}</p>{% endif %}
  </div>
</section>

<section class="page-body">
  <div class="wrap narrow">
    {{ content }}
  </div>
</section>
